[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sitescan"
version = "0.1.0"
description = "Passive, non-destructive web security posture assessment"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "httpx>=0.27",
    "cryptography>=42.0",
    "dnspython>=2.6",
    "rich>=13.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["flask>=3.0", "pytest>=8.0"]

[project.scripts]
sitescan = "sitescan.cli:main"

[tool.setuptools.packages.find]
include = ["sitescan*"]

[tool.setuptools.package-data]
sitescan = ["report/templates/*.j2"]
